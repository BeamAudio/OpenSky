# OpenSky aircraft package format 1. Install this directory as one aircraft package.
format = opensky-aircraft
version = 1
id = c172s
name = Cessna 172S
manufacturer = Cessna
model = 172S
registration = EC-VFR
systems_profile = single_piston_v1
flight_model_dir = .
exterior_model = @shared/models/aircraft/c172s_exterior.glb
cockpit_model = @shared/models/aircraft/c172s_cockpit.glb
rain_front = @shared/pbr/c172_windscreen_rain_front.png
rain_side = @shared/pbr/c172_windscreen_rain_side.png
cockpit_eye_height_m = 0.635
max_flaps_deg = 30
left_tank_capacity_gal = 26.5
right_tank_capacity_gal = 26.5
oil_capacity_quarts = 8
bus_voltage = 28

# Optional canonical GLTF node overrides. Unset roles use the default names.
node.prop_blur = PropBlurDisc
node.prop_blades = PropBlades
node.flap_left = Flap_L
node.flap_right = Flap_R
node.aileron_left = Aileron_L
node.aileron_right = Aileron_R
node.elevator = Elevator
node.rudder = Rudder
node.nose_gear = NoseGear
